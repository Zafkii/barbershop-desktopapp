root = "."
tmp_dir = "tmp"

[build]
  cmd = "CGO_ENABLED=1 go build -o ./tmp/main ."
  entrypoint = ["./tmp/main"]
  include_ext = ["go", "mod", "sum", "html", "tpl", "tmpl"]
  exclude_dir = ["bin", "tmp", "vendor", "assets", "testdata"]
  exclude_regex = ["_test\\.go"]
  send_interrupt = true
  stop_on_error = true
  delay = 300
  kill_delay = "1200ms"

[log]
  time = true

[misc]
  clean_on_exit = true
